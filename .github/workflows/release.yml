name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npx expo prebuild --platform android --non-interactive
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/roadassist-release.keystore
          cat >> android/gradle.properties <<'EOF'
          ROADASSIST_RELEASE_STORE_FILE=roadassist-release.keystore
          ROADASSIST_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}
          ROADASSIST_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          ROADASSIST_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Wire release signing into build.gradle
        run: |
          python3 - <<'EOF'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          assert "ROADASSIST_RELEASE_STORE_FILE" not in s, "already patched"
          signing = """
              signingConfigs {
                  release {
                      if (project.hasProperty('ROADASSIST_RELEASE_STORE_FILE')) {
                          storeFile file(ROADASSIST_RELEASE_STORE_FILE)
                          storePassword ROADASSIST_RELEASE_STORE_PASSWORD
                          keyAlias ROADASSIST_RELEASE_KEY_ALIAS
                          keyPassword ROADASSIST_RELEASE_KEY_PASSWORD
                      }
                  }
              }
          """
          s = s.replace("buildTypes {", signing + "\n    buildTypes {", 1)
          s, n = re.subn(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            if (project.hasProperty('ROADASSIST_RELEASE_STORE_FILE')) { signingConfig signingConfigs.release }", s, count=1)
          assert n == 1, "release buildType not found"
          open(p, "w").write(s)
          print("signing wired")
          EOF
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/release/app-release.apk "roadassist-${TAG}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: roadassist-apk
          path: roadassist-*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: roadassist-*.apk
          generate_release_notes: true
