name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unlock git-crypt
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get install -y git-crypt
          echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/git-crypt-key
          git crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key
      - name: Verify Firebase config
        run: |
          python3 - <<'EOF'
          import json
          doc = json.load(open("google-services.json"))
          project_id = doc["project_info"]["project_id"]
          assert project_id == "roadassistapp-c2e37", project_id
          print("google-services.json OK")
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          test "v$VER" = "$GITHUB_REF_NAME"
      - name: Stamp versionCode
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p));j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -p "require('./app.json').expo.android.versionCode"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npx expo prebuild --platform android --non-interactive
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/roadassist-release.keystore
          echo "" >> android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          ROADASSIST_RELEASE_STORE_FILE=roadassist-release.keystore
          ROADASSIST_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}
          ROADASSIST_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          ROADASSIST_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          grep -qx 'expo.inlineModules.watchedDirectories=\[\]' android/gradle.properties
      - name: Wire release signing into build.gradle
        run: |
          python3 - <<'EOF'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          assert "ROADASSIST_RELEASE_STORE_FILE" not in s, "already patched"
          lines = s.split("\n")
          bt = [i for i, l in enumerate(lines) if l.strip() == "buildTypes {"]
          assert len(bt) == 1, f"buildTypes count {len(bt)}"
          rel = [i for i in range(bt[0], len(lines)) if re.match(r"\s*release\s*\{", lines[i])]
          assert len(rel) == 1, f"release count {len(rel)}"
          tgt = [i for i in range(rel[0], len(lines)) if "signingConfig signingConfigs.debug" in lines[i]]
          assert len(tgt) >= 1, "no signingConfig line in release block"
          lines[tgt[0]] = lines[tgt[0]].replace(
            "signingConfig signingConfigs.debug",
            "if (project.hasProperty('ROADASSIST_RELEASE_STORE_FILE')) { signingConfig signingConfigs.release } else { signingConfig signingConfigs.debug }",
          )
          s = "\n".join(lines)
          signing = """
              signingConfigs {
                  release {
                      if (project.hasProperty('ROADASSIST_RELEASE_STORE_FILE')) {
                          storeFile file(ROADASSIST_RELEASE_STORE_FILE)
                          storePassword ROADASSIST_RELEASE_STORE_PASSWORD
                          keyAlias ROADASSIST_RELEASE_KEY_ALIAS
                          keyPassword ROADASSIST_RELEASE_KEY_PASSWORD
                      }
                  }
              }
          """
          s = s.replace("buildTypes {", signing + "\n    buildTypes {", 1)
          open(p, "w").write(s)
          print("signing wired")
          EOF
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/release/app-release.apk "roadassist-${TAG}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: roadassist-apk
          path: roadassist-*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: roadassist-*.apk
          generate_release_notes: true
